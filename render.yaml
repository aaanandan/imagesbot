services:
  - type: worker
    name: telegram-image-processor
    runtime: node
    plan: free
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: GOOGLE_DRIVE_PARENT_FOLDER_ID
        sync: false   # set this in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # set this in Render Dashboard
